<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxos - Vortex Mídia Ads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .sidebar {
            height: 100vh;
            overflow-y: auto;
            background: #1a1a1a;
        }

        .menu-item {
            padding: 12px 16px;
            margin: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            color: #888;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .menu-item:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .menu-item.active {
            background: #ff6b2c;
            color: white;
        }

        .btn-primary {
            background: #ff6b2c;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #e55a1b;
        }

        .btn-secondary {
            background: white;
            color: #333;
            padding: 8px 12px;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: #f9f9f9;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #666;
            transition: all 0.3s;
        }

        .btn-icon:hover {
            color: #333;
        }

        .btn-delete {
            background: none;
            border: none;
            cursor: pointer;
            color: #ef4444;
            padding: 4px;
        }

        .btn-delete:hover {
            color: #dc2626;
        }

        .flow-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            background: white;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .flow-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .flow-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
        }

        .flow-name {
            font-weight: 600;
            color: #1a1a1a;
            flex: 1;
        }

        .flow-trigger {
            color: #666;
            font-size: 13px;
            margin-top: 2px;
        }

        .channel-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 8px;
        }

        .channel-whatsapp {
            background: #d1fae5;
            color: #065f46;
        }

        .channel-oficial {
            background: #e0e7ff;
            color: #3730a3;
        }

        .channel-instagram {
            background: #fce7f3;
            color: #be185d;
        }

        .toggle {
            position: relative;
            width: 48px;
            height: 24px;
            background: #d1d5db;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 12px;
            border: none;
        }

        .toggle.active {
            background: #ff6b2c;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle.active::after {
            left: 26px;
        }

        .filter-button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            background: white;
            border: 1px solid #e5e5e5;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .filter-button.active {
            background: #ff6b2c;
            color: white;
            border-color: #ff6b2c;
        }

        .folder-item {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 4px;
            cursor: pointer;
            color: #666;
            font-size: 13px;
            transition: all 0.3s;
        }

        .folder-item:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .tab-button {
            padding: 8px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .tab-button.active {
            color: #ff6b2c;
            border-bottom-color: #ff6b2c;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- SIDEBAR -->
        <div class="sidebar w-72 border-r border-gray-300">
            <div class="p-6 border-b border-gray-700">
                <h1 class="text-white font-bold text-xl">🚀 VORTEX</h1>
                <p class="text-gray-400 text-xs mt-1">WhatsApp SaaS</p>
            </div>

            <div class="p-4">
                <p class="text-gray-500 text-xs uppercase font-bold mb-4">Menu</p>
                <div class="menu-item">
                    <span>📊</span>
                    <span>Dashboard</span>
                </div>
                <div class="menu-item">
                    <span>🔗</span>
                    <span>Conexões</span>
                </div>
                <div class="menu-item">
                    <span>📨</span>
                    <span>Inbox</span>
                </div>
                <div class="menu-item active">
                    <span>⚙️</span>
                    <span>Fluxos</span>
                </div>
                <div class="menu-item">
                    <span>📤</span>
                    <span>Disparos</span>
                </div>
                <div class="menu-item">
                    <span>👥</span>
                    <span>Contatos</span>
                </div>
                <div class="menu-item">
                    <span>💼</span>
                    <span>CRM</span>
                </div>
                <div class="menu-item">
                    <span>⚡</span>
                    <span>Respostas Rápidas</span>
                </div>
                <div class="menu-item">
                    <span>📢</span>
                    <span>ADS</span>
                </div>

                <p class="text-gray-500 text-xs uppercase font-bold mt-8 mb-4">Pastas</p>
                <div class="px-2 py-2 border-2 border-dashed border-gray-600 rounded cursor-pointer hover:border-gray-500">
                    <p class="text-gray-500 text-sm text-center">+ Nova pasta</p>
                </div>

                <div class="mt-4">
                    <div class="folder-item">📁 Vendas</div>
                    <div class="folder-item">📁 Suporte</div>
                    <div class="folder-item">📁 Marketing</div>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="flex-1 overflow-auto">
            <!-- HEADER -->
            <div class="bg-white border-b border-gray-200 sticky top-0 z-10">
                <div class="px-8 py-4">
                    <div class="flex items-center gap-4 mb-4">
                        <button class="text-gray-600 text-xl">←</button>
                        <h1 class="text-2xl font-bold">Fluxos</h1>
                        <span class="text-gray-500 text-sm">
                            <span id="active-count">2</span> ativos · <span id="total-count">4</span> total
                        </span>
                    </div>

                    <!-- TABS -->
                    <div class="flex gap-6 border-b border-gray-200">
                        <button class="tab-button active">Fluxos</button>
                        <button class="tab-button">Blocos Avulsos</button>
                    </div>
                </div>

                <!-- FILTERS AND ACTIONS -->
                <div class="px-8 py-4 border-t border-gray-200">
                    <div class="flex flex-col gap-4">
                        <div class="flex gap-3 flex-wrap">
                            <input
                                type="text"
                                placeholder="Buscar fluxos..."
                                class="flex-1 min-w-48 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
                            >
                        </div>

                        <div class="flex gap-2 flex-wrap items-center">
                            <button class="filter-button active">Todos</button>
                            <button class="filter-button">WhatsApp Comum</button>
                            <button class="filter-button">WhatsApp Oficial</button>
                            <button class="btn-secondary">🔽 Filtros</button>
                            <button class="btn-secondary">📥 Importar</button>
                            <button class="btn-secondary">📋 Clonar Funil</button>
                            <button class="btn-secondary">🗑️ Lixeira</button>
                            <button class="btn-primary ml-auto flex items-center gap-2">
                                <span>+</span>
                                <span>Novo Fluxo</span>
                                <span>▼</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FLOWS LIST -->
            <div class="px-8 py-6">
                <div id="flows-container">
                    <!-- Flows will be loaded here -->
                    <div class="text-center py-12">
                        <p class="text-gray-500">Carregando fluxos...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL - NOVO FLUXO -->
    <div id="modal-fluxo" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-md w-full">
            <h2 class="text-xl font-bold mb-4">Novo Fluxo</h2>
            <form id="form-fluxo">
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nome do Fluxo</label>
                    <input
                        type="text"
                        id="flow-name"
                        placeholder="Ex: Saudação Automática"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Tipo de Gatilho</label>
                    <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                        <option>message_received</option>
                        <option>message_sent</option>
                        <option>scheduled</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Tipo de Ação</label>
                    <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                        <option>send_message</option>
                        <option>send_template</option>
                        <option>add_tag</option>
                        <option>webhook</option>
                    </select>
                </div>

                <div class="flex gap-3">
                    <button type="button" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50">
                        Cancelar
                    </button>
                    <button type="submit" class="flex-1 btn-primary">
                        Criar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://vortex-saas-backend-production.up.railway.app/api';
        let userId = localStorage.getItem('userId') || 1;
        let authToken = localStorage.getItem('authToken');

        // Mock data for demonstration
        const mockFlows = [
            {
                id: 1,
                automation_name: 'fluzo',
                trigger_type: 'message_received',
                action_type: 'send_message',
                status: 'active',
                channel: 'WhatsApp',
                description: 'Sem gatilho (só disparo)',
                created_at: '2026-10-01T10:30:00Z'
            },
            {
                id: 2,
                automation_name: 'disparo',
                trigger_type: 'scheduled',
                action_type: 'send_message',
                status: 'active',
                channel: 'Oficial',
                description: 'Todas msgs',
                created_at: '2026-10-02T14:15:00Z'
            },
            {
                id: 3,
                automation_name: 'TESTE',
                trigger_type: 'message_received',
                action_type: 'send_message',
                status: 'inactive',
                channel: 'WhatsApp',
                description: 'Todas msgs',
                created_at: '2026-10-03T09:45:00Z'
            },
            {
                id: 4,
                automation_name: 'TESTE (WhatsApp Oficial)',
                trigger_type: 'message_received',
                action_type: 'send_template',
                status: 'active',
                channel: 'Oficial',
                description: 'Todas msgs',
                created_at: '2026-10-04T16:20:00Z'
            }
        ];

        async function loadFlows() {
            try {
                const response = await fetch(`${API_BASE_URL}/automations?user_id=${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();
                renderFlows(data.automations || mockFlows);
            } catch (error) {
                console.error('Erro ao carregar fluxos:', error);
                renderFlows(mockFlows);
            }
        }

        function renderFlows(flows) {
            const container = document.getElementById('flows-container');
            const activeCount = flows.filter(f => f.status === 'active').length;
            const totalCount = flows.length;

            document.getElementById('active-count').textContent = activeCount;
            document.getElementById('total-count').textContent = totalCount;

            if (flows.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <p class="text-gray-500 mb-4">Nenhum fluxo encontrado</p>
                        <button class="btn-primary">+ Criar primeiro fluxo</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = flows.map(flow => {
                const channelClass = flow.channel === 'Oficial' ? 'channel-oficial' :
                                    flow.channel === 'Instagram' ? 'channel-instagram' :
                                    'channel-whatsapp';

                return `
                    <div class="flow-item">
                        <input type="checkbox" class="flow-checkbox">
                        <div class="flex-1">
                            <div class="flow-name">${flow.automation_name}</div>
                            <div class="flow-trigger">
                                <span class="channel-badge ${channelClass}">
                                    ${flow.channel === 'Oficial' ? '◎ Oficial' : '🟢 ' + flow.channel}
                                </span>
                                <span>${flow.description || 'Sem descrição'}</span>
                            </div>
                        </div>
                        <button class="toggle ${flow.status === 'active' ? 'active' : ''}"
                                onclick="toggleFlow(${flow.id}, this)"></button>
                        <button class="btn-icon">✏️</button>
                        <button class="btn-icon">⚙️</button>
                        <button class="btn-icon">📋</button>
                        <button class="btn-icon">📥</button>
                        <button class="btn-icon">📤</button>
                        <button class="btn-delete">🗑️</button>
                    </div>
                `;
            }).join('');
        }

        function toggleFlow(flowId, button) {
            button.classList.toggle('active');
            console.log('Toggling flow:', flowId);
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            loadFlows();

            // Botão Novo Fluxo
            document.querySelector('.btn-primary').addEventListener('click', () => {
                document.getElementById('modal-fluxo').classList.remove('hidden');
            });

            // Form de criar fluxo
            document.getElementById('form-fluxo').addEventListener('submit', async (e) => {
                e.preventDefault();

                const flowName = document.getElementById('flow-name').value;

                try {
                    const response = await fetch(`${API_BASE_URL}/automations`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({
                            user_id: userId,
                            automation_name: flowName,
                            trigger_type: 'message_received',
                            action_type: 'send_message'
                        })
                    });

                    const data = await response.json();

                    if (data.automation) {
                        alert('Fluxo criado com sucesso!');
                        document.getElementById('modal-fluxo').classList.add('hidden');
                        loadFlows();
                    }
                } catch (error) {
                    console.error('Erro ao criar fluxo:', error);
                    alert('Erro ao criar fluxo');
                }
            });

            // Fechar modal
            document.querySelectorAll('.flow-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                        console.log('Abrir editor de fluxo');
                    }
                });
            });
        });
    </script>
</body>
</html>
