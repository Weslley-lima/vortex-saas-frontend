<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp SaaS - Dashboard de Instâncias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#25D366',
                        darkBg: '#0f0f0f',
                        darkCard: '#1a1a1a',
                        darkBorder: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #e5e5e5;
        }
        .sidebar-active {
            background-color: rgba(37, 211, 102, 0.1);
            border-left: 3px solid #25D366;
            color: #25D366;
            padding-left: calc(0.75rem - 3px);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.15);
        }
        .badge-connected {
            background-color: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        .badge-disconnected {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .qr-modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
        }
        .qr-placeholder {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid #25D366;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-overlay {
            background-color: rgba(0, 0, 0, 0.5);
        }
        @media (max-width: 767px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body class="bg-darkBg text-gray-200">
    <div class="flex h-screen flex-col md:flex-row">
        <!-- Sidebar Overlay (Mobile) -->
        <div id="sidebarOverlay" class="hidden md:hidden fixed inset-0 sidebar-overlay z-40" onclick="closeSidebar()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar w-64 bg-darkCard border-r border-darkBorder fixed md:relative h-screen overflow-y-auto z-50 transform md:transform-none">
            <div class="p-4 md:p-6">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center flex-shrink-0">
                        <svg class="w-6 h-6 text-black" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.67-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.076 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421-7.403h-.004a9.87 9.87 0 00-5.031 1.378c-1.87 1.246-3.045 3.006-3.045 5.411 0 2.552 1.333 4.861 3.834 6.32l-1.02 3.71c-.18.658.083 1.338.72 1.513.637.175 1.331-.41 1.512-1.068l.546-1.99c.537.251 1.06.385 1.484.385 3.849 0 6.956-3.107 6.956-6.956 0-3.848-3.107-6.963-6.956-6.963z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg md:text-xl font-bold text-white">WhatsApp SaaS</h1>
                        <p class="text-xs text-gray-400">Multi-Instâncias</p>
                    </div>
                </div>

                <nav class="space-y-2">
                    <div class="sidebar-active p-3 rounded-lg cursor-pointer flex items-center gap-3 transition">
                        <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10-18v6h8V3h-8zm0 12v6h8v-6h-8z"/>
                        </svg>
                        <span class="font-medium">Dashboard</span>
                    </div>
                    <div class="p-3 rounded-lg cursor-pointer flex items-center gap-3 text-gray-400 hover:text-gray-200 transition">
                        <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                        <span>Configurações</span>
                    </div>
                    <div class="p-3 rounded-lg cursor-pointer flex items-center gap-3 text-gray-400 hover:text-gray-200 transition">
                        <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.3-1.54c-.3-.36-.77-.36-1.07 0-.3.36-.3.92 0 1.28l1.83 2.17c.3.36.77.36 1.07 0 .3-.35.92-1.22 4.04-5.29c.3-.36.3-.92 0-1.28-.3-.36-.77-.36-1.07 0l-2.75 3.54z"/>
                        </svg>
                        <span>Estatísticas</span>
                    </div>
                </nav>

                <div class="absolute bottom-6 left-4 right-4 md:left-6 md:right-6 bg-darkBorder bg-opacity-50 p-4 rounded-lg">
                    <p class="text-xs text-gray-400 mb-3">Plano: <span class="text-primary font-semibold">Professional</span></p>
                    <div class="w-full bg-darkBg rounded-full h-2 mb-2">
                        <div class="bg-primary h-2 rounded-full" style="width: 75%"></div>
                    </div>
                    <p class="text-xs text-gray-400">3 de 5 instâncias usadas</p>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-auto bg-gradient-to-br from-darkBg via-darkBg to-gray-900 w-full">
            <!-- Mobile Header -->
            <div class="md:hidden flex items-center justify-between bg-darkCard border-b border-darkBorder p-4 sticky top-0 z-30">
                <div class="flex items-center gap-2">
                    <button onclick="openSidebar()" class="p-2 hover:bg-darkBorder rounded-lg transition">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                        </svg>
                    </button>
                    <h2 class="font-bold text-white">WhatsApp SaaS</h2>
                </div>
                <button onclick="openNewInstanceModal()" class="bg-primary hover:bg-green-500 text-black font-bold p-2 rounded-lg transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                </button>
            </div>

            <div class="p-4 md:p-8">
                <!-- Desktop Header -->
                <div class="hidden md:flex justify-between items-center mb-8">
                    <div>
                        <h2 class="text-3xl font-bold text-white mb-2">Minhas Instâncias</h2>
                        <p class="text-gray-400">Gerencie suas conexões oficiais do WhatsApp</p>
                    </div>
                    <button onclick="openNewInstanceModal()" class="bg-primary hover:bg-green-500 text-black font-bold py-3 px-6 rounded-lg transition flex items-center gap-2 shadow-lg hover:shadow-xl">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                        Criar Nova Instância
                    </button>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 mb-8">
                    <div class="bg-darkCard border border-darkBorder rounded-lg p-4 md:p-6">
                        <p class="text-gray-400 text-xs md:text-sm mb-2">Total de Instâncias</p>
                        <p class="text-2xl md:text-3xl font-bold text-white" id="totalInstances">3</p>
                    </div>
                    <div class="bg-darkCard border border-darkBorder rounded-lg p-4 md:p-6">
                        <p class="text-gray-400 text-xs md:text-sm mb-2">Conectadas</p>
                        <p class="text-2xl md:text-3xl font-bold text-primary" id="connectedInstances">2</p>
                    </div>
                    <div class="bg-darkCard border border-darkBorder rounded-lg p-4 md:p-6">
                        <p class="text-gray-400 text-xs md:text-sm mb-2">Desconectadas</p>
                        <p class="text-2xl md:text-3xl font-bold text-red-500" id="disconnectedInstances">1</p>
                    </div>
                </div>

                <!-- Instances Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6" id="instancesContainer">
                    <!-- Cards will be injected here by JavaScript -->
                </div>
            </div>
        </main>
    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="hidden fixed inset-0 qr-modal-overlay flex items-center justify-center z-50 p-4">
        <div class="bg-darkCard rounded-lg p-6 md:p-8 max-w-md w-full border border-darkBorder max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg md:text-xl font-bold text-white">Conectar Instância</h3>
                <button onclick="closeQRModal()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
                    </svg>
                </button>
            </div>
            <div id="qrContent"></div>
            <button onclick="closeQRModal()" class="mt-6 w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition">
                Fechar
            </button>
        </div>
    </div>

    <!-- New Instance Modal -->
    <div id="newInstanceModal" class="hidden fixed inset-0 qr-modal-overlay flex items-center justify-center z-50 p-4">
        <div class="bg-darkCard rounded-lg p-6 md:p-8 max-w-md w-full border border-darkBorder max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg md:text-xl font-bold text-white">Criar Nova Instância</h3>
                <button onclick="closeNewInstanceModal()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
                    </svg>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Nome da Instância</label>
                    <input type="text" id="instanceName" placeholder="Ex: Vendas" class="w-full bg-darkBg border border-darkBorder rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-primary text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Número do WhatsApp</label>
                    <input type="text" id="instancePhone" placeholder="55 11 99999-9999" class="w-full bg-darkBg border border-darkBorder rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-primary text-sm">
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeNewInstanceModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition text-sm">
                    Cancelar
                </button>
                <button onclick="createNewInstance()" class="flex-1 bg-primary hover:bg-green-500 text-black font-bold py-2 px-4 rounded-lg transition text-sm">
                    Criar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Dados fictícios iniciais
        let instances = [
            {
                id: 1,
                name: 'Vendas Principal',
                phone: '+55 11 98765-4321',
                status: 'conectado',
                createdAt: '2025-10-01',
                messagesCount: 1248
            },
            {
                id: 2,
                name: 'Suporte ao Cliente',
                phone: '+55 11 99876-5432',
                status: 'conectado',
                createdAt: '2025-09-15',
                messagesCount: 856
            },
            {
                id: 3,
                name: 'Marketing Campaigns',
                phone: '+55 11 97654-3210',
                status: 'desconectado',
                createdAt: '2025-08-20',
                messagesCount: 342
            }
        ];

        // Controlar sidebar em mobile
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.remove('hidden');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.add('hidden');
        }

        // Atualizar estatísticas
        function updateStats() {
            const total = instances.length;
            const connected = instances.filter(i => i.status === 'conectado').length;
            const disconnected = total - connected;

            document.getElementById('totalInstances').textContent = total;
            document.getElementById('connectedInstances').textContent = connected;
            document.getElementById('disconnectedInstances').textContent = disconnected;
        }

        // Renderizar cards de instâncias
        function renderInstances() {
            const container = document.getElementById('instancesContainer');
            container.innerHTML = '';

            instances.forEach(instance => {
                const statusClass = instance.status === 'conectado' ? 'badge-connected' : 'badge-disconnected';
                const statusText = instance.status === 'conectado' ? 'Conectado' : 'Desconectado';
                const statusIcon = instance.status === 'conectado' ? '🟢' : '🔴';

                const card = document.createElement('div');
                card.className = 'bg-darkCard border border-darkBorder rounded-lg p-4 md:p-6 card-hover transition';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="min-w-0">
                            <h3 class="text-base md:text-lg font-bold text-white mb-1 truncate">${instance.name}</h3>
                            <p class="text-xs md:text-sm text-gray-400 truncate">${instance.phone}</p>
                        </div>
                        <span class="text-xs font-semibold px-2 md:px-3 py-1 rounded-full ${statusClass} flex-shrink-0 ml-2">
                            ${statusIcon} <span class="hidden sm:inline">${statusText}</span>
                        </span>
                    </div>

                    <div class="mb-4 pb-4 border-b border-darkBorder">
                        <div class="flex justify-between text-xs md:text-sm mb-2">
                            <span class="text-gray-400">Mensagens enviadas</span>
                            <span class="text-white font-semibold">${instance.messagesCount}</span>
                        </div>
                        <div class="flex justify-between text-xs md:text-sm">
                            <span class="text-gray-400">Conectada em</span>
                            <span class="text-white font-semibold">${new Date(instance.createdAt).toLocaleDateString('pt-BR')}</span>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-2">
                        <button onclick="openQRModal('${instance.name}')" class="flex-1 bg-primary hover:bg-green-500 text-black font-semibold py-2 px-3 rounded-lg transition text-xs md:text-sm flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M3 11h8V3H3v8zm0 8h8v-8H3v8zm8-16v8h8V3h-8zm8 8h-8v8h8v-8z"/>
                            </svg>
                            <span>QR Code</span>
                        </button>
                        <button onclick="deleteInstance(${instance.id})" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-3 rounded-lg transition text-xs md:text-sm flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-9l-1 1H5v2h14V4z"/>
                            </svg>
                            <span class="hidden sm:inline">Excluir</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            updateStats();
            closeSidebar();
        }

        // Abrir modal de QR Code
        function openQRModal(instanceName) {
            const modal = document.getElementById('qrModal');
            const content = document.getElementById('qrContent');

            // Simular um QR Code estilizado
            content.innerHTML = `
                <div class="text-center">
                    <p class="text-gray-300 mb-4 text-sm">Instância: <strong>${instanceName}</strong></p>
                    <div class="qr-placeholder w-48 md:w-64 h-48 md:h-64 mx-auto mb-4 rounded-lg">
                        <svg class="w-full h-full p-4" viewBox="0 0 200 200" fill="none">
                            <defs>
                                <pattern id="qr-pattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
                                    <rect x="0" y="0" width="5" height="5" fill="white"/>
                                </pattern>
                            </defs>
                            <!-- Fundo branco -->
                            <rect width="200" height="200" fill="white"/>

                            <!-- Padrão QR code decorativo -->
                            <g fill="black">
                                <!-- Cantos de localização -->
                                <rect x="10" y="10" width="50" height="50"/>
                                <rect x="140" y="10" width="50" height="50"/>
                                <rect x="10" y="140" width="50" height="50"/>

                                <!-- Quadrados internos dos cantos -->
                                <rect x="15" y="15" width="40" height="40" fill="white"/>
                                <rect x="145" y="15" width="40" height="40" fill="white"/>
                                <rect x="15" y="145" width="40" height="40" fill="white"/>

                                <!-- Quadrados pretos internos -->
                                <rect x="20" y="20" width="30" height="30"/>
                                <rect x="150" y="20" width="30" height="30"/>
                                <rect x="20" y="150" width="30" height="30"/>

                                <!-- Padrão de dados decorativo -->
                                <rect x="70" y="70" width="60" height="60" fill="white" stroke="black" stroke-width="2"/>
                                <circle cx="100" cy="100" r="8" fill="black"/>
                                <circle cx="80" cy="80" r="3" fill="black"/>
                                <circle cx="120" cy="80" r="3" fill="black"/>
                                <circle cx="80" cy="120" r="3" fill="black"/>
                                <circle cx="120" cy="120" r="3" fill="black"/>
                            </g>
                        </svg>
                    </div>
                    <p class="text-gray-400 text-xs md:text-sm">Escaneie o QR Code com seu WhatsApp para conectar</p>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        // Fechar modal de QR Code
        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        // Abrir modal de nova instância
        function openNewInstanceModal() {
            document.getElementById('newInstanceModal').classList.remove('hidden');
            document.getElementById('instanceName').value = '';
            document.getElementById('instancePhone').value = '';
        }

        // Fechar modal de nova instância
        function closeNewInstanceModal() {
            document.getElementById('newInstanceModal').classList.add('hidden');
        }

        // Criar nova instância
        function createNewInstance() {
            const name = document.getElementById('instanceName').value.trim();
            const phone = document.getElementById('instancePhone').value.trim();

            if (!name || !phone) {
                alert('Por favor, preencha todos os campos');
                return;
            }

            const newInstance = {
                id: Math.max(...instances.map(i => i.id), 0) + 1,
                name: name,
                phone: phone,
                status: 'desconectado',
                createdAt: new Date().toISOString().split('T')[0],
                messagesCount: 0
            };

            instances.push(newInstance);
            renderInstances();
            closeNewInstanceModal();
        }

        // Deletar instância
        function deleteInstance(id) {
            if (confirm('Tem certeza que deseja excluir esta instância?')) {
                instances = instances.filter(i => i.id !== id);
                renderInstances();
            }
        }

        // Renderizar ao carregar a página
        document.addEventListener('DOMContentLoaded', renderInstances);

        // Fechar modais ao clicar fora deles
        document.getElementById('qrModal').addEventListener('click', function(e) {
            if (e.target === this) closeQRModal();
        });

        document.getElementById('newInstanceModal').addEventListener('click', function(e) {
            if (e.target === this) closeNewInstanceModal();
        });

        // Fechar sidebar ao clicar em um item
        document.querySelectorAll('#sidebar nav div').forEach(item => {
            item.addEventListener('click', closeSidebar);
        });

        // Permitir fechar modais com ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeQRModal();
                closeNewInstanceModal();
                closeSidebar();
            }
        });
    </script>
</body>
</html>
